<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pennywise · Smart Budget Tracker</title>
  <meta name="description" content="Pennywise is a private personal finance app. Track spending, forecast your month, set goals and get clear insights. Runs entirely in your browser.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script>
    /* Apply saved theme and sidebar state before first paint (no flash). */
    try {
      var s = JSON.parse(localStorage.getItem('pennywise.v1') || '{}'), t = s.theme || 'dark';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (s.sidebar === 'collapsed') document.documentElement.classList.add('nav-collapsed');
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/dashboard" aria-label="Pennywise dashboard">
        <span class="logo" data-icon="trendUp"></span>
        <span class="brand-text"><b>Pennywise</b><small>Smart Budget Tracker</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sb-foot">
        <div class="sb-note"><span data-icon="shield"></span><span class="nav-label">Your data stays on this device</span></div>
        <button class="sb-collapse" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar"><span data-icon="panel"></span><span class="nav-label">Collapse</span></button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="m-brand" href="#/dashboard" aria-label="Pennywise"><span class="logo" data-icon="trendUp"></span></a>
        <div class="page-head">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top-actions">
          <div class="month-nav" id="monthNav" role="group" aria-label="Choose month">
            <button class="icon-btn sm" id="prevMonth" aria-label="Previous month"><span data-icon="chevL"></span></button>
            <button class="month-label" id="monthLabel" title="Jump to current month"></button>
            <button class="icon-btn sm" id="nextMonth" aria-label="Next month"><span data-icon="chevR"></span></button>
          </div>
          <button class="btn ghost-search" id="cmdBtn" aria-label="Open command palette"><span data-icon="search"></span><span class="hide-sm">Search</span><kbd class="hide-sm">Ctrl K</kbd></button>
          <button class="icon-btn bordered" id="themeBtn" aria-label="Toggle theme"></button>
          <button class="btn primary" id="addBtn"><span data-icon="plus"></span><span class="hide-sm">Add transaction</span></button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section class="view" id="v-dashboard" hidden></section>
        <section class="view" id="v-transactions" hidden></section>
        <section class="view" id="v-budgets" hidden></section>
        <section class="view" id="v-goals" hidden></section>
        <section class="view" id="v-insights" hidden></section>
        <section class="view" id="v-settings" hidden></section>
      </main>
    </div>
  </div>

  <dialog id="modal" aria-modal="true"></dialog>
  <dialog id="palette" aria-label="Command palette"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;color:#e6eaf5">Pennywise needs JavaScript to run.</p></noscript>

  <script src="js/core.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/transactions.js?v=2"></script>
  <script src="js/dashboard.js?v=2"></script>
  <script src="js/budgets.js?v=2"></script>
  <script src="js/goals.js?v=2"></script>
  <script src="js/insights.js?v=2"></script>
  <script src="js/settings.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
