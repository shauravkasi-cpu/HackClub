name: Publish to GitHub Pages

# Publishes the site automatically whenever the default branch (or main) changes.
# You can also run it by hand: Actions tab → "Publish to GitHub Pages" → Run workflow.
on:
  push:
    branches:
      - main
      - claude/budgeting-app-animations-donjao
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check JavaScript
        run: |
          for f in js/*.js; do
            node --check "$f" || exit 1
          done
          echo "All scripts parse."

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
